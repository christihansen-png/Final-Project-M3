<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Project M3</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/f5922447fa.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <nav>
      <div class="row nav">
        <div class="logo"><span class="logo__icon">T</span>Treact</div>
        <div class="nav__links">
          <ul>
            <li><a href="#" class="nav__link">About</a></li>
            <li><a href="#" class="nav__link">Blog</a></li>
            <li><a href="#" class="nav__link">Pricing</a></li>
            <li><a href="#" class="nav__link">Contact Us</a></li>
          </ul>
          <ul>
            <li><a href="#" class="nav__link">Login</a></li>
            <li><a href="#" class="btn nav__link--primary">Sign Up</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <header>
      <div class="row header__container">
        <div class="header__content">
          <div class="header__description">
            <h1>
              Beautiful React Templates <span class="purple">for you.</span>
            </h1>
            <p class="header__description--text">
              Our templates are easy to setup, understand and customize. Fully
              modular components with a variety of pages and components.
            </p>
           </div>
           <div class="header__form">
            <input
              type="email"
              placeholder="Your E-mail address"
              class="email"
            />
            <button class="btn">Get Started</button>
           </div>
           <div class="trusted">
            <p class="brands">OUR TRUSTED CUSTOMERS</p> 
            <div class="trusted__logos">
              <img src="assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Trusted by Fortune, Fast Company, and National Geographic">
            </div>
          </div>
        </div>
        <div class="header__img">
          <img
            src="assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg"
            alt=""
          />
        </div>
      </div>
    </header>
  </body>
</html>
